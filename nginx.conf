server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem host/porta absolutos nos redirects (funciona atrás de proxy/TLS)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Raiz: 301 real para o idioma padrão (em vez do meta-refresh gerado pelo Astro)
    location = / {
        return 301 /pt/;
    }

    # URLs antigas (antes do i18n) -> versão em português
    location ~ ^/(homelab|projects|trajetoria)(/.*)?$ {
        return 301 /pt/$1$2;
    }

    # Assets versionados do Astro: cache longo
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve /pt/projects e /pt/projects/ sem redirecionamento extra
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
