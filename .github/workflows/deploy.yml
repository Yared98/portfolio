name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida que o site compila (roda em PR e em push, na infra do GitHub)
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Deploy na infra local (CT 300 / web-shared) via runner self-hosted.
  # Só em push na main, depois do build passar.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, portfolio]
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem (guarda a anterior para rollback)
        run: |
          set -euo pipefail
          docker tag portfolio-site:latest portfolio-site:previous 2>/dev/null || true
          docker build -t portfolio-site:latest .

      - name: Recria o container
        run: |
          set -euo pipefail
          docker rm -f portfolio 2>/dev/null || true
          docker run -d --name portfolio --restart unless-stopped -p 80:80 portfolio-site:latest

      - name: Health check (com rollback em caso de falha)
        run: |
          code=""
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/pt/ || true)
            if [ "$code" = "200" ]; then echo "OK: /pt/ respondeu 200"; exit 0; fi
            sleep 3
          done
          echo "Health check falhou (último status: $code). Fazendo rollback..."
          if docker image inspect portfolio-site:previous >/dev/null 2>&1; then
            docker rm -f portfolio 2>/dev/null || true
            docker run -d --name portfolio --restart unless-stopped -p 80:80 portfolio-site:previous
          fi
          exit 1

      - name: Limpa imagens antigas sem uso
        if: success()
        run: docker image prune -f
